name: go-ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: go ${{ matrix.go-version }} test and package surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.22.12"
          - stable
    steps:
      - name: Check out module
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Check module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test
        run: go test ./...

      - name: Check package metadata
        run: |
          test -f LICENSE
          test -f NATIVE-LICENSE.md
          test -f README.md
          test -f CONSUMING.md

      - name: Check public docs language
        run: |
          python3 - <<'PY'
          from pathlib import Path

          failed = False
          for name in ("README.md", "CONSUMING.md", "doc.go", "packaging.go"):
              text = Path(name).read_text(encoding="utf-8")
              for line_no, line in enumerate(text.splitlines(), 1):
                  if any(ord(ch) > 127 for ch in line):
                      print(f"{name}:{line_no}: non-ASCII public doc text")
                      failed = True
          raise SystemExit(1 if failed else 0)
          PY

      - name: Check exact package inventory
        run: sha256sum --check SHA256SUMS

      - name: Check native payload
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib
          expected = {
              "native/linux-aarch64/libcoakka_runtime_v2.so": "c78b08f0b4cd62e9fb7276ffdb7cb95d8fd9a46ce327600ba45e85c5d4fe2d55",
              "native/linux-x86_64/libcoakka_runtime_v2.so": "666f6e00c63b0b24414d515e1365281ac1e59084871f3a7e7d2c5551383c68d6",
              "native/macos-aarch64/libcoakka_runtime_v2.dylib": "c05e2be0be725e0868e7ebf7387319b040da84794d22b6c1d50e506164dadbfa",
              "native/windows-aarch64/libcoakka_runtime_v2.dll": "d7fcb3a3c17e722cdb2bec5696fd7bd4bf75526bb24e8e41784390b4c18145fe",
              "native/windows-x86_64/libcoakka_runtime_v2.dll": "5418962956871fc82cc830b3614163941970bfb656df96436e03f0a777ac514c",
          }
          actual = {str(p): hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in Path("native").rglob("*") if p.is_file()}
          assert actual == expected, "native inventory or identity changed"
          CHECK

      - name: Run ordinary default-path application
        run: go run -trimpath ./examples/first-run
