name: go-ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: go test and package surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out module
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Check package metadata
        run: |
          test -f LICENSE
          test -f NATIVE-LICENSE.md
          test -f README.md
          test -f CONSUMING.md

      - name: Check public docs language
        run: |
          python3 - <<'PY'
          from pathlib import Path

          failed = False
          for name in ("README.md", "CONSUMING.md", "doc.go", "packaging.go"):
              text = Path(name).read_text(encoding="utf-8")
              for line_no, line in enumerate(text.splitlines(), 1):
                  if any(ord(ch) > 127 for ch in line):
                      print(f"{name}:{line_no}: non-ASCII public doc text")
                      failed = True
          raise SystemExit(1 if failed else 0)
          PY

      - name: Check native payload
        run: |
          native_count="$(find native -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) | wc -l | tr -d ' ')"
          test "${native_count}" = "5"

          expected_platforms=(
            "linux-aarch64"
            "linux-x86_64"
            "macos-aarch64"
            "windows-aarch64"
            "windows-x86_64"
          )
          for platform in "${expected_platforms[@]}"; do
            test -d "native/${platform}"
          done

          unexpected_aliases="$(find native -type f \( \
            -name 'libcoakka_runtime_v2.so' -o \
            -name 'libcoakka_runtime_v2.dylib' -o \
            -name 'libcoakka_runtime_v2.dll' \
          \) -print)"
          test -z "${unexpected_aliases}"

          unpinned="$(find native -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) -print | grep -Ev '/libcoakka_runtime_v2-[0-9]+\.[0-9]+\.[0-9]+\+[^/]+\.(so|dylib|dll)$' || true)"
          test -z "${unpinned}"
