name: go-ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: go ${{ matrix.go-version }} test and package surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.22.12"
          - stable
    steps:
      - name: Check out module
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Check module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test
        run: go test ./...

      - name: Check package metadata
        run: |
          test -f LICENSE
          test -f NATIVE-LICENSE.md
          test -f README.md
          test -f CONSUMING.md

      - name: Check public docs language
        run: |
          python3 - <<'PY'
          from pathlib import Path

          failed = False
          for name in ("README.md", "CONSUMING.md", "doc.go", "packaging.go"):
              text = Path(name).read_text(encoding="utf-8")
              for line_no, line in enumerate(text.splitlines(), 1):
                  if any(ord(ch) > 127 for ch in line):
                      print(f"{name}:{line_no}: non-ASCII public doc text")
                      failed = True
          raise SystemExit(1 if failed else 0)
          PY

      - name: Check exact package inventory
        run: sha256sum --check SHA256SUMS

      - name: Check native payload
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib
          expected = {'native/macos-aarch64/libcoakka_runtime_v2.dylib': '5ef45ad964a43c3e91c6c69bd731dbc5ac30348721ebffa7d384a7ce05bc4dd2', 'native/linux-x86_64/libcoakka_runtime_v2.so': '4736f09d4a68073c6b9f7043f6418ab5a316ee0ec06a11b92510c65c1247ba81', 'native/linux-aarch64/libcoakka_runtime_v2.so': '9092c59320f2aa8d3431e01ac10f292c82b545c23d74f51dcde4855741966de8', 'native/windows-aarch64/libcoakka_runtime_v2.dll': '720a73215b4cbee231cbaadb766704d60ff999b11d52411819484e738f91bacd', 'native/windows-x86_64/libcoakka_runtime_v2.dll': 'dba531e09359f270a22543ec3b1a4a4bf9750e965c2b5920966871faaff88e4d'}
          actual = {str(p): hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in Path("native").rglob("*") if p.is_file()}
          assert actual == expected, "native inventory or identity changed"
          CHECK

      - name: Run ordinary default-path application
        run: go run -trimpath ./examples/first-run
